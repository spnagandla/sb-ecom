version: 2
updates:

  # 1) Maven dependency updates
  - package-ecosystem: "maven"
    # Look for pom.xml in the root of the repository
    directory: "/"
    schedule:
      interval: "daily"

  # 2) GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"


# Dependabot will open pull requests when:
# - a dependency has a security vulnerability
# - a newer compatible version is available