name: Merge pipeline

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  verify_build_push:
    runs-on: ubuntu-latest

    steps:
      # 1) Clone repo into the runner workspace
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Setup Java for Maven build/tests
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3) VERIFY step (tests + basic checks)
      - name: Maven verify
        run: mvn -B -U verify

      # 4) Login to Docker Hub (so we can push)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5) Build + push Docker image
      - name: Build and push
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/buyology_backend"
          docker build -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:latest"
