<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyology - Smart Ecommerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo" onclick="showView('products-view')">Buyology</div>
            <ul id="nav-links">
                <li><a href="#" onclick="showView('products-view')">Home</a></li>
                <li id="nav-cart" class="hidden"><a href="#" onclick="showView('cart-view')">Cart (<span id="cart-count">0</span>)</a></li>
                <li id="nav-login"><a href="#" onclick="showView('login-view')">Login</a></li>
                <li id="nav-signup"><a href="#" onclick="showView('signup-view')">Signup</a></li>
                <li id="nav-logout" class="hidden"><a href="#" onclick="handleLogout()">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main id="app">
        <!-- Notifications -->
        <div id="notification" class="notification hidden"></div>

        <!-- Products View -->
        <section id="products-view" class="view">
            <h2>Our Products</h2>
            <div id="product-grid" class="product-grid">
                <p>Loading products...</p>
            </div>
        </section>

        <!-- Cart View -->
        <section id="cart-view" class="view hidden">
            <h2>Your Shopping Cart</h2>
            <div id="cart-container">
                <div id="cart-items"></div>
                <div id="cart-summary" class="cart-summary hidden">
                    <h3>Total: $<span id="cart-total-price">0.00</span></h3>
                    <button class="btn btn-primary">Checkout</button>
                </div>
            </div>
        </section>

        <!-- Login View -->
        <section id="login-view" class="view hidden">
            <div class="form-container">
                <h2>Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>
        </section>

        <!-- Signup View -->
        <section id="signup-view" class="view hidden">
            <div class="form-container">
                <h2>Create Account</h2>
                <form id="signup-form">
                    <div class="form-group">
                        <label for="signup-username">Username</label>
                        <input type="text" id="signup-username" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Buyology Ecommerce</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
